[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# DB URL is now configured at runtime in env.py via environment variable.
# Fallback for offline mode if env var is not set:
# WARNING: sqlalchemy.url is overridden at runtime by alembic/env.py 
# via the DATABASE_URL environment variable. The value below is only 
# used if env var is not set (offline mode). For Alembic to work 
# with PostgreSQL, set DATABASE_URL in .env or environment.
sqlalchemy.url = postgresql+asyncpg://postgres:Faizan9517@localhost:5432/faizan20

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
